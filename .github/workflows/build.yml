name: Build rootless deb

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          libgcuniversal: 'false'
          altlist: 'false'

      - name: Read package version
        id: package
        run: |
          VERSION="$(awk '/^Version:/ {print $2; exit}' control)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Watusi-Scheduled-MsgFix-rootless
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          DEB="$(ls packages/*.deb | head -n 1)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" \
              --target "$GITHUB_SHA" \
              --title "Watusi Scheduled Message Fix ${TAG}" \
              --notes "iOS 16 rootless build. ${TAG} now includes the direct scheduler and retries due Watusi messages instead of dropping them after one wake attempt."
          fi
